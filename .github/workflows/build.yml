name: build-dashboard

# Regenera data/dashboard.html (modo público, sin datos personales) y lo publica
# en Netlify. Las claves van como "Secrets" del repo, nunca en el HTML.
#
# Secrets necesarios (Settings -> Secrets and variables -> Actions):
#   OPENSEA_API_KEY        clave de OpenSea (ya la tenías)
#   WLMT_URL / WLMT_KEY    fuente WLMT opcional (ya las tenías)
#   NETLIFY_AUTH_TOKEN     panel Netlify -> User settings -> Applications ->
#                          Personal access tokens -> New access token
#   NETLIFY_SITE_ID        panel Netlify -> tu sitio -> Site configuration ->
#                          Site details -> Site ID
#
# El sitio de Netlify ("monitor-mints") se crea una vez en el panel (Add new
# site -> Deploy manually). Las funciones de /api/* viven en netlify/functions/
# y se despliegan junto con el sitio. Variables de entorno de las funciones
# (OPENSEA_API_KEY, BLOCKSCOUT_API_KEY, GEMINI_API_KEY) se ponen en el panel,
# no aquí.

on:
  push:
    branches: [master]        # se reconstruye también al subir cambios
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    # cada 10 min. GitHub Actions puede retrasar/agrupar ejecuciones programadas
    # si hay carga (sobre todo al inicio de cada hora); el intervalo real suele
    # quedar en 10-20 min. Repo PÚBLICO: minutos de Actions ilimitados.
    # Repo PRIVADO: 2000 min/mes gratis -> a este ritmo NO caben; sube a "*/45".
    - cron: "*/10 * * * *"
  workflow_dispatch: {}       # botón "Run workflow" manual

permissions:
  contents: read

concurrency:
  group: deploy-monitor-mints
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restaurar caché de supply de Monad (para detectar mints en curso)
        uses: actions/cache@v4
        with:
          path: data/monad-supply-cache.json
          key: monad-supply-${{ github.run_id }}
          restore-keys: |
            monad-supply-

      - name: Generar dashboard público
        working-directory: scripts
        env:
          PUBLIC: "1"
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
          WLMT_URL: ${{ secrets.WLMT_URL }}
          WLMT_KEY: ${{ secrets.WLMT_KEY }}
        run: node update.mjs

      - name: Preparar carpeta de publicación
        run: |
          mkdir -p site/app
          cp -r web/. site/                           # landing + assets -> /
          cp data/dashboard.html site/app/index.html  # radar            -> /app/

      - name: Desplegar en Netlify
        run: npx --yes netlify-cli@latest deploy --prod --dir=site --functions=netlify/functions --message "${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Revisar predicciones de análisis con IA ya maduras
        run: curl -s -X POST https://mintscope.fun/api/review-predictions || true
