name: build-dashboard

# Regenera data/dashboard.html (modo público, sin datos personales) y lo publica
# en Cloudflare Pages. Las claves van como "Secrets" del repo, nunca en el HTML.
#
# Secrets necesarios (Settings -> Secrets and variables -> Actions):
#   OPENSEA_API_KEY        clave de OpenSea (ya la tenías)
#   WLMT_URL / WLMT_KEY    fuente WLMT opcional (ya las tenías)
#   CLOUDFLARE_API_TOKEN   panel CF -> My Profile -> API Tokens ->
#                          plantilla "Edit Cloudflare Workers" (o permiso
#                          Account · Cloudflare Pages · Edit)
#   CLOUDFLARE_ACCOUNT_ID  panel CF -> Workers & Pages -> Account ID (barra derecha)
#
# El proyecto de Pages ("monitor-mints") se crea una vez en el panel de Cloudflare
# (o con `wrangler pages project create monitor-mints --production-branch=master`).

on:
  push:
    branches: [master]        # se reconstruye también al subir cambios
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    # cada 10 min. GitHub Actions puede retrasar/agrupar ejecuciones programadas
    # si hay carga (sobre todo al inicio de cada hora); el intervalo real suele
    # quedar en 10-20 min. Repo PÚBLICO: minutos de Actions ilimitados.
    # Repo PRIVADO: 2000 min/mes gratis -> a este ritmo NO caben; sube a "*/45".
    - cron: "*/10 * * * *"
  workflow_dispatch: {}       # botón "Run workflow" manual

permissions:
  contents: read

concurrency:
  group: deploy-monitor-mints
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar dashboard público
        working-directory: scripts
        env:
          PUBLIC: "1"
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
          WLMT_URL: ${{ secrets.WLMT_URL }}
          WLMT_KEY: ${{ secrets.WLMT_KEY }}
        run: node update.mjs

      - name: Preparar carpeta de publicación
        run: |
          mkdir -p site/app
          cp -r web/. site/                           # landing + assets -> mintscope.fun/
          cp data/dashboard.html site/app/index.html  # radar            -> mintscope.fun/app/

      - name: Desplegar en Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=monitor-mints --branch=master --commit-dirty=true
