name: community-portfolios

# Calcula la cartera / P&L de las direcciones de data/community-wallets.json y
# commitea el resultado en public-data/portfolios/. El workflow build-dashboard
# copia esa carpeta a Pages en su siguiente pasada (<=10 min).

on:
  schedule:
    - cron: "17 */6 * * *"     # cada 6 h (minuto 17 para no chocar con build-dashboard)
  workflow_dispatch:
    inputs:
      force:
        description: "Recalcular todas (ignorar frescura)"
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - "data/community-wallets.json"   # alguien se apuntó -> calcula ya

permissions:
  contents: write

concurrency:
  group: community-portfolios
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Calcular carteras
        working-directory: scripts
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
          FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '1' || '' }}
        run: node community-portfolios.mjs

      - name: Commit y push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/portfolios
          if git diff --staged --quiet; then
            echo "Sin cambios en las carteras."
            exit 0
          fi
          git commit -m "carteras comunidad: actualización automática [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin master && git push && exit 0
            echo "push falló (intento $i), reintento…"; sleep 5
          done
          exit 1
